name: Daily SEO automation

# The daily schedule is owned by the existing Claude routine. This optional
# diagnostic runs against the production source without publishing or pushing.
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: manual-technical-seo-diagnostic
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Audit checked-in pages and sitemap
        shell: python
        run: |
          import os, sys
          from pathlib import Path
          Path('logs').mkdir(exist_ok=True)
          sys.path.insert(0, str(Path('automation').resolve()))
          from technical_crawl_check import run
          report = run()
          import json
          (Path(os.environ['RUNNER_TEMP']) / 'public-technical-crawl.json').write_text(json.dumps(report, indent=2))
          sm = report['sitemap']
          pages = sum(1 for p in Path('site').rglob('*.html'))
          counts = {'HTML parser findings (advisory)': len(report['html_validity_issues']), 'Internal link findings': len(report['broken_internal_links']), 'Duplicate title groups': len(report['duplicate_titles']), 'Language or canonical findings': len(report['hreflang_canonical']['issues'])}
          lines = ['## Production source audit', f'HTML files: {pages}', f'Sitemap URLs: {sm.get("url_count", 0)}; missing targets: {sm.get("urls_missing_count", "unknown")}', '']
          lines.extend(f'- {key}: {count}' for key, count in counts.items())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              print(*lines, sep='\n', file=out)
          if not pages or not sm.get('valid_xml') or not sm.get('url_count') or sm.get('urls_missing_count'):
              raise SystemExit('Missing pages, unusable sitemap, or unresolved sitemap destinations; see crawl report.')
          if any(counts.values()):
              print('::warning::The crawl found items for review. Counts are in the summary; file-level findings are in the artifact.')
      - name: Save public site crawl findings for seven days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-technical-crawl
          path: ${{ runner.temp }}/public-technical-crawl.json
          retention-days: 7
      - name: Check optional Search Console connection
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          set -eu
          if [ -z "$GSC_SERVICE_ACCOUNT_JSON" ]; then
            echo 'Google Search Console: not tested here (credential not configured).' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          umask 077
          key_dir="$HOME/.config/boathire-seo"
          mkdir -p "$key_dir"
          trap 'rm -f "$key_dir/service-account-key.json"' EXIT
          printf '%s' "$GSC_SERVICE_ACCOUNT_JSON" > "$key_dir/service-account-key.json"
          unset GSC_SERVICE_ACCOUNT_JSON
          python -m pip install -q google-auth google-api-python-client
          python automation/daily_seo_agent.py > "$RUNNER_TEMP/seo-agent.log" 2>&1
          python - <<'PY'
          import datetime, json, os
          from pathlib import Path
          day = datetime.datetime.now(datetime.timezone.utc).date().isoformat()
          report = json.loads((Path('reports/daily_seo') / f'seo_report_{day}.json').read_text())
          ok = report.get('gsc_status') == 'ok'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              print('Google Search Console: data received.' if ok else 'Google Search Console: no data returned; check the credential and property access.', file=out)
          if not ok:
              raise SystemExit('Search Console returned no data.')
          PY
      - name: Confirm the diagnostic left the website unchanged
        if: always()
        run: git diff --exit-code -- site/
